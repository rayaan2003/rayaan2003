<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0a14"/><stop offset="1" stop-color="#171232"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a78bfa" stroke-opacity="0.07"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
<clipPath id="c"><rect width="1000" height="260" rx="20"/></clipPath>
</defs>
<style>
@keyframes cyc{0%{opacity:0}4%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,20px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.p0{opacity:0;animation:cyc 12s infinite;animation-delay:0s}.p1{opacity:0;animation:cyc 12s infinite;animation-delay:4s}.p2{opacity:0;animation:cyc 12s infinite;animation-delay:8s}
.cur{animation:blink 1s steps(1) infinite}
.o1{animation:f1 9s ease-in-out infinite} .o2{animation:f2 11s ease-in-out infinite}
.nm{animation:rise 1.1s ease-out both} .tag{animation:rise 1.1s .25s ease-out both}
</style>
<g clip-path="url(#c)">
<rect width="1000" height="260" fill="url(#bg)"/>
<rect width="1000" height="260" fill="url(#grid)"/>
<g filter="url(#blur)"><circle class="o1" cx="200" cy="60" r="90" fill="#7c3aed" opacity="0.55"/><circle class="o2" cx="820" cy="210" r="100" fill="#0891b2" opacity="0.4"/><circle class="o1" cx="560" cy="20" r="60" fill="#db2777" opacity="0.25"/></g>
<text class="nm" x="500" y="108" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="url(#nm)">Rayaan Sheikh</text>
<text class="tag" x="500" y="146" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="4" fill="#94a3b8">AI BUILDER  ·  LONDON</text>
<text class="p0" x="500" y="198" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" fill="#c4b5fd">&gt; Runtime safety for AI agents<tspan class="cur" fill="#22d3ee">▌</tspan></text><text class="p1" x="500" y="198" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" fill="#c4b5fd">&gt; Agents · MCP · sequence models<tspan class="cur" fill="#22d3ee">▌</tspan></text><text class="p2" x="500" y="198" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" fill="#c4b5fd">&gt; LARPing in AI (but shipping too)<tspan class="cur" fill="#22d3ee">▌</tspan></text>
</g>
<rect x="0.5" y="0.5" width="999" height="259" rx="20" fill="none" stroke="#a78bfa" stroke-opacity="0.25"/>
</svg>
